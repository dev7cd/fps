[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fps"
version = "6.1.0"
description = "Fiber Packing System - Generateur de RVE pour composites a fibres renforcees"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Devine Ngouloubi"},
]

dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.9,<2.0",
    "numba>=0.56,<1.0",
    "gmsh>=4.11,<5.0",
    "meshio>=5.3,<6.0",
    "matplotlib>=3.5,<4.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.4,<7.0"]
dev = ["pytest>=7.0,<9.0"]

[project.scripts]
fps = "cli:parse_args"

[tool.setuptools]
py-modules = ["cli", "main", "gui", "run_campaign", "run_campaign_short"]

[tool.setuptools.packages.find]
include = ["core", "collision", "export", "generation", "geometry", "utils", "validation", "visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
