name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Oldest supported Python: no 3.9 build for ubuntu-latest (Ubuntu 26.04)
          - os: ubuntu-24.04
            python-version: "3.9"
          # The platforms announced in the documentation, on a current Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # gmsh's Python API links against a few system X11/GL libraries even
      # when used headless.
      - name: Install gmsh runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install FPS (base + dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

      - name: Command-line entry points
        run: |
          fps --help
          fps-regenerate --help
